name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  # Новый пуш в ветку отменяет предыдущий: старый прогон без пользы сжигает
  # минуты и место в очереди.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Бэкенд (lint, типы, тесты)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workflow_engine
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Alembic использует синхронный драйвер: асинхронный умеет нет
      # MissingGreenlet (psycopg), asyncpg — умеет.
      SYNC_DATABASE_URL: postgresql+psycopg://workflow:workflow@localhost:5432/workflow_engine
      DATABASE_URL: postgresql+asyncpg://workflow:workflow@localhost:5432/workflow_engine
      APP_ENV: test
      DEBUG: "false"
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Подключить uv
        uses: astral-sh/setup-uv@v6

      # --frozen: разрешено из узла слотать нельзя, иначе разносится между
      # машинами.
      - name: Установка зависимостей
        run: uv sync --frozen

      - name: Миграции
        run: uv run alembic upgrade head

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

      # Прогон без chaos: они поднимают дополнительные процессы и подолгую
      # занимают БД. Прогон имеет свою задачу и обращается со своей БД заранее.
      - name: Тесты (unit + integration)
        run: uv run pytest -m "not chaos"

  chaos:
    name: Chaos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workflow_engine
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNC_DATABASE_URL: postgresql+psycopg://workflow:workflow@localhost:5432/workflow_engine
      DATABASE_URL: postgresql+asyncpg://workflow:workflow@localhost:5432/workflow_engine
      APP_ENV: test
      DEBUG: "false"
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      # Отдельная задача: chaos-тесты поднимают воркеры и падают при первом
      # же обрыве БД.
      - name: Chaos-тесты
        run: uv run pytest -m chaos --no-cov

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Отдельный npm test не нужен: test:coverage и так прогоняет все тесты и
      # падает на пороге покрытия ниже.
      - name: Тесты и покрытие
        run: npm run test:coverage
      - run: npm run build

  smoke:
    name: Стенд целиком
    runs-on: ubuntu-latest
    env:
      # compose публикует БД на 5434 и API на 8000 — это
      # значения из .env.example, которые применяются к автоматическим
      # запускам.
      DATABASE_URL: postgresql+asyncpg://workflow:workflow@localhost:5434/workflow_engine
      APP_ENV: test
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6

      # Сборка нужна ими же по такой же причине, что и в задаче бэкенда.
      # Скрипты seed и smoke остаются в .dockerignore, и в рабочем образе
      # скрипты в образе результата не попадут.
      - name: Поднять стенд
        run: docker compose up -d --build db migrate api worker worker-2

      - name: Ждать API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$API_URL/health"; then exit 0; fi
            sleep 2
          done
          echo "API не поднялся за 120 с"
          docker compose logs api
          exit 1

      - name: Установить зависимости
        working-directory: engine
        run: uv sync --frozen

      - name: Наполнить определения
        working-directory: engine
        run: uv run python -m scripts.seed

      - name: Сквозная проверка
        working-directory: engine
        run: uv run python -m scripts.smoke --url "$API_URL"

      - name: Журнал стенда
        if: always()
        run: docker compose logs --no-color --tail 200 api worker worker-2