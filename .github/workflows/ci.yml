name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  # \u041d\u043e\u0432\u044b\u0439 \u043f\u0443\u0448 \u0432 \u0432\u0435\u0442\u043a\u0443 \u043e\u0442\u043c\u0435\u043d\u044f\u0435\u0442 \u043f\u0440\u0435\u0434\u044b\u0434\u0443\u0449\u0438\u0439: \u0441\u0442\u0430\u0440\u044b\u0439 \u043f\u0440\u043e\u0433\u043e\u043d \u0431\u0435\u0437 \u043f\u043e\u043b\u044c\u0437\u044b \u043d\u0435 \u0438\u043c\u0435\u0442 \u0441\u043c\u044b\u0441\u043b\u0430.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: \u0411\u0435\u043a\u0435\u043d\u0434 (lint, \u0442\u0438\u043f\u044b, \u0442\u0435\u0441\u0442\u044b)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workflow_engine
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Alembic \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442 \u0441\u0438\u043d\u0445\u0440\u043e\u043d\u043d\u044b\u0439 \u0434\u0440\u0430\u0439\u0432\u0435\u0440: \u0430\u0441\u044f\u043d\u0433\u043f\u0438
      # \u043d\u0435 \u0443\u043c\u0435\u0435\u0442 MissingGreenlet (psycopg), asyncpg \u2014 \u0443\u043c\u0435\u0435\u0442.
      SYNC_DATABASE_URL: postgresql+psycopg://workflow:workflow@localhost:5432/workflow_engine
      DATABASE_URL: postgresql+asyncpg://workflow:workflow@localhost:5432/workflow_engine
      APP_ENV: test
      DEBUG: "false"
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: \u041f\u043b\u043e\u0434\u043a\u043b\u0435\u043d\u044c uv
        uses: astral-sh/setup-uv@v6

      # --frozen: \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043d\u0438\u0435 \u0438\u0437 \u0443\u0436\u0435 \u0441\u043b\u043e\u0432\u0430\u0442\u044c
      # \u043d\u0435 \u0434\u043e\u043b\u0436\u043d\u043e, \u0438\u043d\u0430\u0447\u0435 \u043e\u043d\u043e \u0440\u0430\u0437\u043d\u043e\u0441\u0438\u0442\u0441\u044f \u043c\u0435\u0436\u0434\u0443 \u043f\u0440\u043e\u0433\u043e\u043d\u0430\u043c\u0438.
      - name: \u0423\u0441\u0442\u0430\u043d\u043e\u0432\u043a\u0430 \u0437\u0430\u0432\u0438\u0441\u0438\u043c\u043e\u0441\u0442\u0435\u0439
        run: uv sync --frozen

      - name: \u041c\u0438\u0433\u0440\u0430\u0446\u0438\u0438
        run: uv run alembic upgrade head

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

      # \u041f\u043e\u0440\u043e\u0433 \u0431\u0435\u0437 chaos: \u043e\u043d\u0438 \u043c\u0435\u0434\u043b\u0435\u043d\u043d\u044b\u0435 \u0438 \u043f\u043e\u0434\u043d\u0438\u043c\u0430\u044e\u0442
      # \u0434\u043e\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0435 \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u044b, \u0438 \u0432 \u044d\u0442\u043e\u0439 \u0436\u043e\u0431\u0435 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u0430\u044f.
      # \u041f\u043e\u0440\u043e\u0433 \u0438\u043c\u0435\u0435\u0442 \u0432 \u0441\u0435\u0431\u044f \u0437\u0430\u0434\u0430\u0447\u0430 \u0438 \u043e\u0431\u0440\u0430\u0449\u0430\u0435\u0442 \u0441\u0432\u043e\u044e \u0411\u0414 \u0437\u0430 \u043d\u0435\u0435\u0442.
      - name: \u0422\u0435\u0441\u0442\u044b (unit + integration)
        run: uv run pytest -m "not chaos"

  chaos:
    name: Chaos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workflow_engine
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNC_DATABASE_URL: postgresql+psycopg://workflow:workflow@localhost:5432/workflow_engine
      DATABASE_URL: postgresql+asyncpg://workflow:workflow@localhost:5432/workflow_engine
      APP_ENV: test
      DEBUG: "false"
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      # \u041e\u0442\u0434\u0435\u043b\u044c\u043d\u0430\u044f \u0437\u0430\u0434\u0430\u0447\u0430: chaos-\u0442\u0435\u0441\u0442\u044b \u043f\u043e\u0434\u043d\u044f\u043c\u0430\u044e\u0442
      # \u0432\u0440\u0435\u043c\u044f \u0438 \u043f\u0430\u0434\u0430\u044e\u0442 \u043f\u0440\u0438 \u043f\u0435\u0440\u0432\u043e\u043c \u043f\u0430\u0434\u0435\u043d\u0438\u0438.
      - name: Chaos-\u0442\u0435\u0441\u0442\u044b
        run: uv run pytest -m chaos --no-cov

  frontend:
    name: \u0424\u0440\u043e\u043d\u0442\u0435\u043d\u0434
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Порог покрытия: отчёт только то, что можно проверить без DOM.
      # Если появиться «100% покрытие» на невыполнённом коде, это обманующет.
      - run: npm run test:coverage

  smoke:
    name: \u0421\u0442\u0435\u043d\u0434 \u0446\u0435\u043b\u0438\u043a\u043e\u043c
    runs-on: ubuntu-latest
    env:
      # compose \u043f\u0443\u0431\u043b\u0438\u043a\u0443\u0435\u0442 \u0411\u0414 \u043d\u0430 5434 \u0438 API \u043d\u0430 8000 \u2014 \u044d\u0442\u043e
      # \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u044f \u0438\u0437 .env.example, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u043f\u0440\u0438\u043c\u0438\u0440\u0443\u044e\u0442\u0441\u044f \u043a \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u043c \u0438\u043c\u0435\u043d\u0430\u043c.
      DATABASE_URL: postgresql+asyncpg://workflow:workflow@localhost:5434/workflow_engine
      APP_ENV: test
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6

      # \u0421\u0431\u043e\u0440\u043a\u0430 \u0438\u043c\u0435\u0436\u043d\u0430\u044f \u0448\u0430\u0441\u0442\u0438\u0446\u0430 \u0442\u0430\u043a\u0430\u044f \u0436\u0435 \u0443 \u043b\u043e\u043a\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u0441\u0442\u0435\u043d\u0434\u0430.
      # \u0421\u043a\u0440\u0438\u043f\u0442\u044b seed \u0438 smoke \u043e\u0441\u0442\u0430\u044e\u0442\u0441\u044f \u0432 .dockerignore, \u0438 \u0432\u0440\u0430\u0431\u043e\u0447\u0435\u043c \u043e\u0431\u0440\u0430\u0437\u0435
      # \u0441\u043a\u0440\u0438\u043f\u0442\u044b \u0432\u043e\u0437\u0434\u0443 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0430 \u043d\u0435 \u043f\u043e\u043f\u0430\u0434\u0443\u0442.
      - name: \u041f\u043e\u0434\u043d\u044f\u0442\u044c \u0441\u0442\u0435\u043d\u0434
        run: docker compose up -d --build db migrate api worker worker-2

      - name: \u0416\u0434\u0430\u0442\u044c API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$API_URL/health"; then exit 0; fi
            sleep 2
          done
          echo "API \u043d\u0435 \u043f\u043e\u0434\u044f\u043b\u0441\u044f \u0437\u0430 120 \u0441"
          docker compose logs api
          exit 1

      - name: \u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u044c \u0437\u0430\u0432\u0438\u0441\u0438\u043c\u043e\u0441\u0442\u0438
        working-directory: engine
        run: uv sync --frozen

      - name: \u041d\u0430\u043f\u043e\u043b\u043d\u0438\u0442\u044c \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u0435\u043d\u0438\u044f
        working-directory: engine
        run: uv run python -m scripts.seed

      - name: \u0421\u043a\u0432\u043e\u0437\u043d\u0430\u044f \u043f\u0440\u043e\u0432\u0435\u0440\u043a\u0430
        working-directory: engine
        run: uv run python -m scripts.smoke --url "$API_URL"

      - name: \u0416\u0443\u0440\u043d\u0430\u043b \u0441\u0442\u0435\u043d\u0434\u0430
        if: always()
        run: docker compose logs --no-color --tail 200 api worker worker-2