[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# URL не задаётся здесь: alembic/env.py берёт его из app.core.config,
# чтобы локальный запуск и Docker Compose читали одну и ту же настройку.
sqlalchemy.url =

[post_write_hooks]
# exec, а не console_scripts: ruff ставится отдельным бинарником без точки входа,
# и console_scripts-вариант не находит его ни в venv, ни в глобальном окружении.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
