name: workflow-engine

services:
  db:
    image: postgres:16-alpine
    container_name: we-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflow_engine}
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workflow} -d ${POSTGRES_DB:-workflow_engine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Миграции выполняются один раз перед стартом api/worker.
  migrate:
    build:
      context: ./engine
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://workflow:workflow@db:5432/workflow_engine}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./engine
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://workflow:workflow@db:5432/workflow_engine}
      DEBUG: ${DEBUG:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Две реплики воркера: они конкурируют за инстансы через SKIP LOCKED и lease.
  worker:
    build:
      context: ./engine
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://workflow:workflow@db:5432/workflow_engine}
      LEASE_TTL_SECONDS: ${LEASE_TTL_SECONDS:-30}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-2:
    build:
      context: ./engine
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://workflow:workflow@db:5432/workflow_engine}
      LEASE_TTL_SECONDS: ${LEASE_TTL_SECONDS:-30}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: node:22-alpine
    container_name: we-frontend
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
