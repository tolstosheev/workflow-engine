name: workflow-engine

services:
  db:
    image: postgres:16-alpine
    container_name: we-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflow_engine}
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workflow} -d ${POSTGRES_DB:-workflow_engine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Миграции выполняются один раз перед стартом api/worker.
  migrate:
    build:
      context: ./engine
    command: ["alembic", "upgrade", "head"]
    environment:
      # Alembic работает через синхронный драйвер: asyncpg в синхронном
      # контексте падает с MissingGreenlet на первом соединении.
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-workflow}:${POSTGRES_PASSWORD:-workflow}@db:5432/${POSTGRES_DB:-workflow_engine}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./engine
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # Адрес БД внутри сети compose — литеральный, ровно как у `migrate` выше.
      #
      # Здесь стояла подстановка `${DATABASE_URL:-...}`, и она была тихой
      # поломкой: compose берёт переменную из окружения оболочки, а адрес БД для
      # хостовых скриптов (scripts.seed, scripts.load, pytest) — это
      # `localhost:5434`. Заданная в оболочке, она уезжала внутрь контейнера,
      # где такого хоста нет, и воркер уходил в бесконечные попытки соединения,
      # оставаясь «живым»: инстансы висели в очереди, не показывая причины.
      # Подстановки здесь быть не должно — адрес контейнера не выбирают.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-workflow}:${POSTGRES_PASSWORD:-workflow}@db:5432/${POSTGRES_DB:-workflow_engine}
      DEBUG: ${DEBUG:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Общий каталог метрик: API собирает счётчики и воркеров из своих
      # процессов из общего каталога (ADR-0012). Без него счётчики воркера не попадут в /metrics.
      PROMETHEUS_MULTIPROC_DIR: /var/prometheus-shared
    volumes:
      - prometheus_shared:/var/prometheus-shared
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Две реплики воркера: они конкурируют за инстансы через SKIP LOCKED и lease.
  worker:
    build:
      context: ./engine
    command: ["python", "-m", "app.worker"]
    # Уникальные pid в разных контейнерах: файлы метрик называются по pid,
    # и два воркера с pid 1 записывали бы в один файл и счётчики терялись.
    pid: host
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-workflow}:${POSTGRES_PASSWORD:-workflow}@db:5432/${POSTGRES_DB:-workflow_engine}
      LEASE_TTL_SECONDS: ${LEASE_TTL_SECONDS:-30}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-5}
      COMPENSATION_RETRY_BASE_SECONDS: ${COMPENSATION_RETRY_BASE_SECONDS:-5}
      COMPENSATION_RETRY_MAX_SECONDS: ${COMPENSATION_RETRY_MAX_SECONDS:-300}
      PROMETHEUS_MULTIPROC_DIR: /var/prometheus-shared
    volumes:
      - prometheus_shared:/var/prometheus-shared
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-2:
    build:
      context: ./engine
    command: ["python", "-m", "app.worker"]
    # Уникальные pid в разных контейнерах: файлы метрик называются по pid,
    # и два воркера с pid 1 записывали бы в один файл и счётчики терялись.
    pid: host
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-workflow}:${POSTGRES_PASSWORD:-workflow}@db:5432/${POSTGRES_DB:-workflow_engine}
      LEASE_TTL_SECONDS: ${LEASE_TTL_SECONDS:-30}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-5}
      COMPENSATION_RETRY_BASE_SECONDS: ${COMPENSATION_RETRY_BASE_SECONDS:-5}
      COMPENSATION_RETRY_MAX_SECONDS: ${COMPENSATION_RETRY_MAX_SECONDS:-300}
      PROMETHEUS_MULTIPROC_DIR: /var/prometheus-shared
    volumes:
      - prometheus_shared:/var/prometheus-shared
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: node:22-alpine
    container_name: we-frontend
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      # Адрес бэкенда для прокси Vite — сетевое имя, литерал. Брать его из
      # окружения нельзя: опубликованный порт (`API_PORT`) живёт на машине, а
      # здесь нужен адрес сервиса в сети compose. Пока в браузере был абсолютный
      # адрес из `VITE_API_URL`, порт настраивался двумя переменными, и смена
      # одной молча ломала вторую: страница открывалась, а запросы уходили в
      # никуда. Теперь браузер ходит в свой же origin, а прокси внутри сети
      # знает бэкенд по имени.
      API_PROXY_TARGET: "http://api:8000"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
  # Каталог метрик: общий для всех процессов, иначе запускается
  # со своей стране не следут не в каталоге.
  prometheus_shared:
